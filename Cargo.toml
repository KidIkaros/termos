[package]
name = "termos"
version = "0.1.0"
edition = "2021"
description = "TermOS — a terminal multiplexer and window manager, ported to Rust from TUIOS"
license = "MIT"

[[bin]]
name = "termos"
path = "src/main.rs"

[lib]
name = "termos"
path = "src/lib.rs"

[dependencies]
# Terminal I/O (raw mode, events) — the Rust counterpart of Bubble Tea's input
crossterm = "0.28"
# Rendering — the Rust counterpart of Lipgloss
ratatui = "0.29"

# PTY management (matching the workspace's proven nix-based pattern)
nix = { version = "0.29", features = ["process", "term", "ioctl", "fs", "signal"] }

# Channels for cross-thread communication
crossbeam-channel = "0.5"

# Unicode column width (UAX #11)
unicode-width = "0.2"

# Configuration file (TOML)
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5.0"

# Logging
log = "0.4"
env_logger = "0.11"

# Base64 encoding for OSC52
base64 = "0.22"

# UUIDs for window/session IDs
uuid = { version = "1", features = ["v4"] }

# Regex for the wait-for verb
regex = "1"

# SHA-256 for the tape trust store
sha2 = "0.10"

# Async runtime for network modes (SSH server, web server). Optional so the
# local TUI binary doesn't pull in tokio when network features are disabled.
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "macros", "time"], optional = true }
# SSH server (russh is a pure-Rust SSH implementation).
russh = { version = "0.45", optional = true }
russh-keys = { version = "0.45", optional = true }
async-trait = { version = "0.1", optional = true }
rand = { version = "0.8", optional = true }
# Web server: HTTP + WebSocket.
axum = { version = "0.7", features = ["ws"], optional = true }
tokio-tungstenite = { version = "0.24", optional = true }
# TLS for SSH/web.
rustls = { version = "0.23", optional = true }
rustls-pemfile = { version = "2", optional = true }

[features]
default = []
network = ["dep:tokio", "dep:russh", "dep:russh-keys", "dep:async-trait", "dep:rand", "dep:axum", "dep:tokio-tungstenite"]
tls = ["network", "dep:rustls", "dep:rustls-pemfile"]

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1"
futures-util = "0.3"

[[bench]]
name = "vt_write"
harness = false

[[bench]]
name = "vt_scroll"
harness = false

[[bench]]
name = "vt_render"
harness = false
