<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>TermOS Web</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5/css/xterm.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5/lib/xterm.min.js"></script>
  <style>
    body { margin: 0; background: #000; }
    #terminal { padding: 8px; }
  </style>
</head>
<body>
  <div id="terminal"></div>
  <script>
    const term = new Terminal({ cols: 80, rows: 24, theme: { background: '#000' } });
    term.open(document.getElementById('terminal'));

    // The session is the URL path: / picks the picker page, /<session> is a
    // terminal attached to that daemon session.
    let session = '';
    const rawPath = location.pathname.slice(1);
    if (rawPath) {
      try {
        session = decodeURIComponent(rawPath);
      } catch (e) {
        session = rawPath;
      }
      document.title = `TermOS — ${session}`;
    }

    // Carry the token from the login flow (e.g. /?token=...) onto the WebSocket
    // handshake, which the server validates the same way as the page.
    const wsPath = session ? `/ws/${encodeURIComponent(session)}` : '/ws';
    const ws = new WebSocket(`ws://${location.host}${wsPath}${location.search}`);
    ws.binaryType = 'arraybuffer';

    ws.onmessage = (event) => {
      const msg = JSON.parse(event.data);
      if (msg.type === 'output') {
        term.write(msg.data);
      } else if (msg.type === 'error') {
        term.write(`\r\n[${msg.data}]\r\n`);
      }
    };

    term.onData((data) => {
      ws.send(JSON.stringify({ type: 'input', data }));
    });

    // Forward mouse events when the terminal app enables mouse tracking.
    // xterm.js sends SGR mouse sequences via onBinary; base64-encode for
    // JSON transport.
    term.onBinary((data) => {
      ws.send(JSON.stringify({ type: 'mouse', data: btoa(data) }));
    });

    ws.onclose = () => {
      term.write('\r\n[Connection closed]\r\n');
    };
  </script>
</body>
</html>
