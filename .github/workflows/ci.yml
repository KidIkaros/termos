name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config
      - name: Build
        run: cargo build --verbose
      - name: Build with network features
        run: cargo build --features network --verbose
      - name: Test (default)
        run: cargo test --verbose
      - name: Test (with network)
        run: cargo test --features network --verbose
      - name: Clippy (default, deny warnings)
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy (with network, deny warnings)
        run: cargo clippy --all-targets --features network -- -D warnings
      - name: Bench compile-check
        run: cargo bench --no-run
      - name: Release build
        run: cargo build --release --verbose
      - name: Release build with network
        run: cargo build --release --features network --verbose

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
